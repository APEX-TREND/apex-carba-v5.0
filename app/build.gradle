plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apexcarba.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.apexcarba.app"
        minSdk 21
        targetSdk 34
        versionCode 30
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
